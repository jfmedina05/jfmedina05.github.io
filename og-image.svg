  </text>

  <text x="120" y="258"
        font-family="Syne, Arial, Helvetica, sans-serif"
        font-size="92"
        font-weight="800"
        fill="#E8EAF0">
    Jaiden Medina
  </text>

  <text x="120" y="326"
        font-family="Georgia, serif"
        font-size="34"
        fill="#AAB4C5">
    Embedded Systems · Edge AI · Data Engineering
  </text>

  <text x="120" y="374"
        font-family="Georgia, serif"
        font-size="34"
        fill="#AAB4C5">
    Healthcare Technology · Human-Centered Engineering
  </text>

  <rect x="120" y="430" width="236" height="44" rx="22" fill="rgba(245,166,35,0.12)" stroke="rgba(245,166,35,0.45)"/>
  <text x="142" y="459" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" fill="#F5A623">
