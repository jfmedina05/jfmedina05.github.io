  </text>

  <rect x="376" y="430" width="214" height="44" rx="22" fill="rgba(74,158,255,0.12)" stroke="rgba(74,158,255,0.4)"/>
  <text x="398" y="459" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" fill="#4A9EFF">
    Embedded AI
  </text>

  <rect x="610" y="430" width="218" height="44" rx="22" fill="rgba(245,166,35,0.12)" stroke="rgba(245,166,35,0.45)"/>
  <text x="632" y="459" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" fill="#F5A623">
    Leadership
  </text>

  <text x="120" y="520"
        font-family="IBM Plex Mono, Consolas, monospace"
